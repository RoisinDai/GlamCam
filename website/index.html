<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GlamCam</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        background-color: black;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      #video-container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      .closet-item.selected {
        outline: 2px solid #f8c8c6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React and ReactDOM from CDN -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- App configuration -->
    <script src="/static/js/config.js"></script>
    <!-- Main React application -->
    <script src="/static/js/app.js"></script>
  </body>
</html>
